name: Update Agent Data

on:
  schedule:
    - cron: '5 6 */2 * *'  # Every 2 days at 06:05 UTC
  workflow_dispatch:          # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # ── Python: Data Pipeline ──────────────────────────────

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests --quiet

      - name: Fetch missing days from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/fetch_daily.py

      - name: Classify new repos (HF Inference API)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/classify_new_repos.py

      - name: Update cumulative JSONs
        run: python scripts/update_data.py

      # ── Node.js: Static Build ──────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # ── Deploy: Copy to docs/ and push ─────────────────────

      - name: Deploy to docs/
        run: |
          rm -rf docs/*
          cp -r out/* docs/
          cp public/.nojekyll docs/.nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ public/data/*.json data/classified_repos.txt data/processed_dates.txt
          git diff --cached --quiet || git commit -m "data: update $(date -u +%Y-%m-%d) + rebuild site"
          git push
